services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buyer_agent
      POSTGRES_USER: buyer_agent
      POSTGRES_PASSWORD: buyer_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyer_agent -d buyer_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - buyer_agent_postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_RELOAD: "false"
      APP_HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg://buyer_agent:buyer_agent@database:5432/buyer_agent
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  buyer_agent_postgres:
